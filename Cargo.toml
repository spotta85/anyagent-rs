[package]
name = "anyagent"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "One Rust interface to the coding agents installed on a machine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/spotta85/anyagent-rs"
documentation = "https://docs.rs/anyagent"
readme = "README.md"
keywords = ["agent", "acp", "claude", "codex", "cli"]
categories = ["api-bindings", "development-tools"]
exclude = ["docs/", "image.png"]

[workspace]
exclude = ["spikes/s0-acp"]

[dependencies]
agent-client-protocol-schema = { version = "1.7", default-features = false }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process", "io-util", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "io-std"] }
