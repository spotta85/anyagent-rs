[package]
name = "anyagent"
version = "0.0.2"
edition = "2024"
rust-version = "1.88"
description = "One Rust interface to the coding agents installed on a machine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/spotta85/anyagent-rs"
homepage = "https://anyagent.mintlify.site"
documentation = "https://docs.rs/anyagent"
readme = "README.md"
keywords = ["agent", "acp", "claude", "codex", "cli"]
categories = ["api-bindings", "development-tools"]
exclude = ["docs/", "image.png", "packages/node"]

[workspace]
exclude = ["spikes/s0-acp"]

[features]
# `Runtime::with_mock` and `anyagent::mock`: the real engine over a scripted
# agent, for testing an app without a subprocess.
mock = []
# `sidecar::schema()`: one JSON schema of every wire type, for the wrappers.
schema = ["dep:schemars"]

[dependencies]
agent-client-protocol-schema = { version = "1.7", default-features = false }
async-trait = "0.1"
command-group = { version = "5.0.1", features = ["with-tokio"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
schemars = { version = "1", optional = true }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util", "io-std", "fs", "net"] }

[dev-dependencies]
# Integration tests and examples see the mock agent.
anyagent = { path = ".", features = ["mock"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[example]]
name = "schema"
required-features = ["schema"]
